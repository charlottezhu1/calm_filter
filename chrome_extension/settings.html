<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px 16px; width: 230px; }
    h3 { margin: 0 0 6px; font-size: 15px; }
    label { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #eee; cursor: pointer; }
    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; transition: background .2s; }
    .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .2s; }
    input:checked + .slider { background: #1da1f2; }
    input:checked + .slider::before { transform: translateX(18px); }
  </style>
</head>
<body>
  <h3>Calm Filter</h3>
  <label>Hide HAN posts <span class="switch"><input type="checkbox" id="filterHan"><span class="slider"></span></span></label>
  <label>Color post borders <span class="switch"><input type="checkbox" id="showColors"><span class="slider"></span></span></label>
  <label>Affect distribution <span class="switch"><input type="checkbox" id="showChart"><span class="slider"></span></span></label>
  <script src="settings.js"></script>
</body>
</html>
